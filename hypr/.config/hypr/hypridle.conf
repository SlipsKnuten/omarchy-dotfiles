general {
    lock_cmd = omarchy-lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session               # lock before suspend.
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  # turn on display after resume
    inhibit_sleep = 3                                      # wait until screen is locked
}

listener {
    timeout = 500                                             # ~8.3min
    on-timeout = pidof hyprlock || omarchy-launch-screensaver # start screensaver (if we haven't locked already)
}

listener {
    timeout = 501                      # ~8.3min, 1s after screensaver
    on-timeout = loginctl lock-session # lock screen when timeout has passed
}

# Keyboard backlight moved to separate hypridle instance (hypridle-kbd.conf)
# so it works even when browser media inhibits idle

# DPMS off removed — causes black screen / wake failures on AMD GPUs
# Screen is already locked by hyprlock above; backlight off saves power instead
listener {
    timeout = 330                                            # 5.5min
    on-timeout = brightnessctl -s set 0                       # save + turn off backlight (safe alternative to dpms off)
    on-resume = brightnessctl -r                             # restore backlight
}

listener {
    timeout = 600                                            # 10min
    on-timeout = systemctl suspend                           # suspend after extended idle
}
