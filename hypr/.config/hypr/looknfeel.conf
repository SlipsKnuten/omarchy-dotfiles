# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Variables/#cursor
cursor {
    # Hide cursor after 5 seconds of inactivity — synced with the keyboard
    # backlight idle-off timeout in ~/.config/hypr/hypridle-kbd.conf.
    inactive_timeout = 5
}

# Workaround for basecamp/omarchy#5758: Hyprland 0.55 no longer accepts -1 as a
# fallback color in group:col.border_locked_*. Remove once the upstream fix
# (PR #5723) lands on master.
group {
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor
}

# Suppress the config-error overlay until the upstream fix lands.
debug {
    suppress_errors = true
}
