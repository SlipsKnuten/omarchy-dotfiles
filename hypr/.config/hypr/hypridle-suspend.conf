general {
    # Unlike the keyboard-only hypridle instance, this one must respect media,
    # application, and system sleep inhibitors.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false

    # Quattro's omarchy-sleep-lock service already owns secure pre-sleep
    # locking, so this timer must not add a redundant delay inhibitor.
    inhibit_sleep = 0
}

# Suspend after 30 minutes without input, but only when the helper confirms the
# laptop is on battery and Quattro's Stay Awake toggle is not enabled.
listener {
    timeout = 1800
    on-timeout = $HOME/.config/hypr/scripts/suspend-on-battery-idle.sh
}
