# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Docked setup: 4K on left, 2K portrait on right
monitor = desc:LG Electronics 27GN950, 3840x2160@60, 0x0, 1.5
monitor = desc:LG Electronics LG ULTRAGEAR, 2560x1440@144, 2560x0, 1, transform, 3

# Fallback for laptop and other monitors (enables when undocked)
monitor = , preferred, auto, auto
