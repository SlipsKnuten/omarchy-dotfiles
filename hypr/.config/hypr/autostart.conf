# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = hypridle -c ~/.config/hypr/hypridle-kbd.conf

# Monitor hotplug handler - restarts wallpaper and waybar when monitors change
exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh

# Turn keyboard backlight on at login (ASUS LED resets to 0 on boot/resume).
# Resume-from-suspend is handled by after_sleep_cmd in hypridle.conf.
exec-once = brightnessctl -d '*::kbd_backlight' set 1
