[Sleep]
# Keep short sleeps fast, then eliminate most overnight battery drain.
HibernateDelaySec=2h
# This laptop exposes a stale UCSI USB-C source as online even while the real
# ACAD adapter is offline. Do not let that false AC state cancel hibernation
# and leave a closed laptop awake after the two-hour timer.
HibernateOnACPower=yes
